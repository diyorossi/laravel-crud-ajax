stages:
  - test
  - merge
  - deploy

before_script:
  - whoami
  - pwd

test_fixfeat:
  stage: test
  script: |
    echo "Skip test for now"
  only:
    - fixfeat

merge_to_testing:
  stage: merge
  script: |
    git config --global user.email "ci@gitlab.com"
    git config --global user.name "GitLab CI"

    git fetch origin
    git checkout testing
    git pull origin testing
    git merge "$CI_COMMIT_SHA" --no-ff -m "CI: merge fixfeat into testing"
    git push origin testing
  only:
    - fixfeat

deploy_testing:
  stage: deploy
  only:
    - fixfeat
  needs:
    - merge_to_testing
  script: |
    cd /home/diyorossi/docker-laravel-crud/app/laravel-crud-ajax
    pwd
    docker --version
