stages:
  - test
  - merge
  - deploy

variables:
  GIT_STRATEGY: clone

before_script:
  - git config --global user.email "ci@gitlab.com"
  - git config --global user.name "GitLab CI"

# =========================
# CI - TEST
# =========================
test_fixfeat:
  stage: test
  tags:
    - docker
  script:
    - composer install --no-interaction --prefer-dist
    - php artisan key:generate || true
    - php artisan test || true
  only:
    - fixfeat

# =========================
# AUTO MERGE fixfeat -> testing
# =========================
merge_to_testing:
  stage: merge
  tags:
    - docker
  script:
    - git fetch origin
    - git checkout testing
    - git pull origin testing
    - git merge origin/fixfeat --no-ff -m "CI: merge fixfeat into testing"
    - git push origin testing
  only:
    - fixfeat

# =========================
# DEPLOY TESTING
# =========================
deploy_testing:
  stage: deploy
  tags:
    - docker
  script:
    - cd /home/diyorossi/docker-laravel-crud/app/laravel-crud-ajax
    - git pull origin testing
    - docker compose down
    - docker compose up -d --build
  only:
    - fixfeat
